<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grandMA3 – ArtNet Pult</title>
    <script>
    document.addEventListener('DOMContentLoaded', function () {

        // URL zur Simulator-Datei (bei Bedarf manuell anpassen)
        window.ARTNET_SIMULATOR_URL = 'raw.githubusercontent.com/RainerHorn/VT_LF10/refs/heads/master/HTML/Kapitel%204%20Artnet/Artnet_Simulator.html';

        // ============================================================
        // CSS INJECTION
        // ============================================================
        const style = document.createElement('style');
        style.textContent = `
            html { font-size: 30px; }
            *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

            :root {
                --bg:      #0a0a0a;
                --surf:    #141414;
                --raised:  #1e1e1e;
                --btn:     #2a2a2a;
                --btn-hov: #363636;
                --border:  #282828;
                --text:    #c0c0c0;
                --dim:     #5a5a5a;
                --gold:    #c8a000;
                --gold-bg: #1a1400;
                --green:   #00c840;
                --green-bg:#001a08;
                --blue:    #2080ff;
                --blue-bg: #001830;
                --red:     #ff4020;
                --red-bg:  #200800;
                --yellow:  #e0b000;
                --yel-bg:  #1a1200;
                --cyan:    #00c8d0;
            }

            html {
                overflow-x: hidden;
                background: var(--bg);
            }
            body {
                width: 100%; min-height: 100vh; height: auto;
                overflow-x: hidden;
                overflow-y: auto;
                background: var(--bg);
                color: var(--text);
                font-family: 'Segoe UI', Arial, sans-serif;
                font-size: 0.75rem;
                user-select: none;
            }

            /* ── Console Shell ── */
            .ma-console {
                display: flex;
                flex-direction: column;
                width: 100vw;
                min-height: 100vh;
                height: auto;
            }

            /* ── Top Bar ── */
            .ma-topbar {
                display: flex;
                align-items: center;
                gap: 10px;
                min-height: 38px;
                background: #0d0d0d;
                border-bottom: 2px solid var(--gold);
                padding: 6px 12px;
                flex-shrink: 0;
            }
            .ma-logo {
                background: linear-gradient(135deg,#c8a000,#e8c830);
                color: #000;
                font-weight: 900;
                font-size: 0.78rem;
                padding: 3px 9px;
                border-radius: 3px;
                letter-spacing: 0.06em;
                text-transform: uppercase;
                font-family: 'Arial Black', sans-serif;
            }
            .ma-title { color: var(--dim); font-size: 0.78rem; flex: 1; }
            .ma-conn {
                display: flex; align-items: center; gap: 5px;
                font-size: 0.72rem;
                color: var(--dim);
            }
            .ma-conn-dot {
                width: 8px; height: 8px; border-radius: 50%;
                background: #3a3a3a; border: 1px solid #555;
                transition: background 0.3s;
            }
            .ma-conn-dot.on  { background: var(--green); box-shadow: 0 0 6px var(--green); }
            .ma-conn-dot.blink { animation: blink 0.4s infinite alternate; }
            @keyframes blink { from { opacity:1; } to { opacity: 0.3; } }

            .ma-softkeys {
                display: flex; gap: 3px; margin-left: 8px;
            }
            .softkey {
                padding: 2px 9px;
                background: var(--btn);
                border: 1px solid var(--border);
                color: var(--dim);
                border-radius: 3px;
                font-size: 0.7rem;
                cursor: pointer;
                transition: all 0.1s;
            }
            .softkey:hover { background: var(--btn-hov); color: var(--text); }
            .softkey.active { background: var(--blue-bg); border-color: var(--blue); color: var(--blue); }

            /* ── Main 3-col Layout ── */
            .ma-main {
                display: grid;
                grid-template-columns: 6rem 1fr 8rem;
                flex: 1;
                min-height: 600px;
                gap: 1px;
                background: #050505;
            }
            .ma-panel {
                background: var(--surf);
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }
            .panel-title {
                font-size: 0.62rem;
                font-weight: 700;
                letter-spacing: 0.12em;
                color: var(--gold);
                padding: 5px 8px 3px;
                border-bottom: 1px solid var(--border);
                background: #0e0e0e;
                flex-shrink: 0;
            }
            .panel-body {
                overflow-y: auto;
                overflow-x: hidden;
                flex: 1;
                padding: 7px 12px 7px 7px;
            }
            .panel-body::-webkit-scrollbar { width: 6px; }
            .panel-body::-webkit-scrollbar-track { background: var(--bg); }
            .panel-body::-webkit-scrollbar-thumb { background: #383838; border-radius: 3px; }
            .panel-body::-webkit-scrollbar-thumb:hover { background: #505050; }

            /* ── Footer ── */
            .ma-footer {
                min-height: 32px;
                background: #080808;
                border-top: 1px solid var(--border);
                display: flex;
                align-items: center;
                padding: 6px 12px;
                gap: 8px;
                flex-shrink: 0;
            }
            .cmd-prompt { color: var(--gold); font-family: monospace; font-size: 0.8rem; }
            .cmd-display { color: var(--text); font-family: monospace; font-size: 0.8rem; flex: 1; min-width: 0; overflow: hidden; }
            .cmd-caret { animation: blink 0.6s infinite; }
            .cmd-info { font-size: 0.68rem; color: var(--dim); }

            /* ── Section Labels ── */
            .sec-label {
                font-size: 0.6rem;
                font-weight: 700;
                letter-spacing: 0.15em;
                color: var(--dim);
                margin: 10px 0 5px;
                text-transform: uppercase;
            }
            .sec-label:first-child { margin-top: 0; }
            hr.ma-sep { border: none; border-top: 1px solid var(--border); margin: 7px 0; }

            /* ── Fixture Buttons (left panel) ── */
            .fix-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 4px;
                margin-bottom: 8px;
            }
            .fix-btn {
                background: var(--btn);
                border: 1px solid var(--border);
                border-radius: 5px;
                padding: 5px 4px;
                cursor: pointer;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 3px;
                transition: border-color 0.12s, background 0.12s;
            }
            .fix-btn:hover { border-color: #3a3a5a; background: var(--btn-hov); }
            .fix-btn.selected { border-color: var(--blue); background: var(--blue-bg); }
            .fix-name { font-size: 0.66rem; color: var(--dim); }
            .fix-dot {
                width: 14px; height: 14px;
                border-radius: 50%;
                background: #111;
                border: 1px solid #2a2a2a;
                transition: background 0.1s;
            }

            .group-btn {
                display: block;
                width: 100%;
                background: var(--btn);
                border: 1px solid var(--border);
                color: var(--dim);
                padding: 5px 8px;
                margin-bottom: 3px;
                border-radius: 4px;
                cursor: pointer;
                font-size: 0.72rem;
                text-align: left;
                transition: all 0.1s;
            }
            .group-btn:hover { border-color: #5a5a5a; color: var(--text); background: var(--btn-hov); }
            .group-btn.active { border-color: var(--blue); color: var(--blue); background: var(--blue-bg); }

            /* ── EXECUTOR WING (center) ── */
            .exec-grid {
                display: grid;
                grid-template-columns: repeat(6, 1fr);
                gap: 6px;
                margin-bottom: 12px;
            }

            .exec-block {
                display: flex;
                flex-direction: column;
                gap: 3px;
                align-items: center;
            }
            .exec-screen {
                width: 100%;
                min-height: 44px;
                background: #050508;
                border: 1px solid #2a2a2a;
                border-radius: 4px;
                padding: 3px 4px;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                transition: border-color 0.15s, background 0.15s;
                overflow: hidden;
            }
            .exec-screen:hover { border-color: #4a4a4a; }
            .exec-screen.active {
                background: #031003;
                border-color: var(--green);
                box-shadow: 0 0 8px rgba(0,200,64,0.25);
            }
            .exec-screen.flash-active {
                background: #18100a;
                border-color: var(--yellow);
            }
            .exec-num {
                font-size: 0.55rem;
                color: #4a4a4a;
                font-family: monospace;
                line-height: 1;
            }
            .exec-ico { font-size: 1.1rem; line-height: 1; }
            .exec-name {
                font-size: 0.55rem;
                color: #8a8a8a;
                text-align: center;
                line-height: 1.2;
                max-width: 100%;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .exec-name.active { color: var(--green); }
            .exec-led {
                width: 8px; height: 3px;
                border-radius: 1px;
                background: #1a1a1a;
                transition: background 0.1s;
            }
            .exec-led.active { background: var(--green); }
            .exec-led.flash  { background: var(--yellow); }

            .exec-btns { display: flex; gap: 3px; width: 100%; }
            .exec-go {
                flex: 1;
                background: #0a180a;
                border: 1px solid #1a3a1a;
                color: var(--green);
                padding: 3px 2px;
                font-size: 0.62rem;
                border-radius: 3px;
                cursor: pointer;
                transition: all 0.1s;
                text-align: center;
            }
            .exec-go:hover, .exec-go:active { background: #103010; border-color: var(--green); }
            .exec-flash {
                flex: 1;
                background: #181200;
                border: 1px solid #3a3000;
                color: var(--yellow);
                padding: 3px 2px;
                font-size: 0.62rem;
                border-radius: 3px;
                cursor: pointer;
                transition: all 0.1s;
                text-align: center;
            }
            .exec-flash:hover { background: #201800; border-color: var(--yellow); }

            /* ── Master Faders ── */
            .master-row {
                display: flex;
                gap: 10px;
                justify-content: center;
                align-items: flex-end;
                padding: 4px 0 8px;
            }
            .master-block {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 4px;
            }
            .master-label {
                font-size: 0.6rem;
                color: var(--dim);
                letter-spacing: 0.08em;
                text-align: center;
            }
            .master-label.grand { color: var(--gold); }
            .fader-track {
                width: 18px;
                height: 110px;
                background: #0a0a0a;
                border: 1px solid var(--border);
                border-radius: 9px;
                display: flex;
                align-items: flex-end;
                justify-content: center;
                padding: 4px;
                cursor: pointer;
                position: relative;
            }
            .fader-fill {
                width: 10px;
                border-radius: 5px;
                background: linear-gradient(to top, var(--gold) 0%, #e8c050 100%);
                transition: height 0.05s;
                min-height: 2px;
            }
            .fader-fill.mh   { background: linear-gradient(to top, #4080ff, #80b0ff); }
            .fader-fill.par  { background: linear-gradient(to top, #c040a0, #e080d0); }
            .fader-fill.grand{ background: linear-gradient(to top, var(--gold), #e8c050); }
            .fader-track input {
                position: absolute;
                width: 110px;
                height: 18px;
                transform: rotate(-90deg);
                opacity: 0;
                cursor: pointer;
                z-index: 2;
            }
            .master-val {
                font-size: 0.62rem;
                color: var(--gold);
                font-family: monospace;
                width: 38px;
                text-align: center;
            }
            .master-val.mh  { color: #80b0ff; }
            .master-val.par { color: #e080d0; }

            /* ── Sequence Player ── */
            .seq-box {
                background: #0a0a0f;
                border: 1px solid var(--border);
                border-radius: 6px;
                padding: 8px;
                margin-bottom: 8px;
            }
            .seq-select {
                width: 100%;
                background: #0f0f18;
                border: 1px solid #2a2a4a;
                color: var(--text);
                padding: 4px 6px;
                border-radius: 4px;
                font-size: 0.76rem;
                margin-bottom: 6px;
            }
            .seq-select:focus { outline: none; border-color: var(--blue); }
            .seq-display {
                background: #050510;
                border: 1px solid #1a1a30;
                border-radius: 4px;
                padding: 5px 7px;
                font-size: 0.68rem;
                color: #4a80a0;
                font-family: monospace;
                margin-bottom: 6px;
                min-height: 34px;
                line-height: 1.5;
            }
            .seq-controls { display: flex; gap: 4px; }
            .seq-btn {
                flex: 1;
                padding: 5px 4px;
                border-radius: 4px;
                border: 1px solid var(--border);
                background: var(--btn);
                color: var(--dim);
                font-size: 0.72rem;
                cursor: pointer;
                text-align: center;
                transition: all 0.1s;
            }
            .seq-btn:hover { border-color: #5a5a5a; color: var(--text); }
            .seq-btn.play  { background: var(--green-bg); border-color: #1a5a1a; color: var(--green); }
            .seq-btn.play:hover { background: #051505; border-color: var(--green); }
            .seq-btn.stop  { background: var(--red-bg); border-color: #3a1010; color: var(--red); }
            .seq-btn.loop-on { background: var(--blue-bg); border-color: var(--blue); color: var(--blue); }
            .seq-cue-list { margin-top: 5px; }
            .seq-cue-item {
                font-size: 0.66rem;
                color: #3a5a6a;
                padding: 2px 0;
                border-bottom: 1px solid #0f1520;
                display: flex;
                gap: 6px;
            }
            .seq-cue-item.current { color: var(--green); }
            .seq-cue-num { width: 20px; color: #2a4a5a; font-family: monospace; }

            /* ── ENCODER SECTION (right panel) ── */
            .enc-select-row {
                display: flex;
                flex-wrap: wrap;
                gap: 3px;
                margin-bottom: 8px;
            }
            .enc-fix-btn {
                padding: 2px 7px;
                background: var(--btn);
                border: 1px solid var(--border);
                color: var(--dim);
                border-radius: 3px;
                font-size: 0.64rem;
                cursor: pointer;
                transition: all 0.1s;
            }
            .enc-fix-btn:hover { border-color: #5a5a5a; color: var(--text); }
            .enc-fix-btn.active { background: var(--blue-bg); border-color: var(--blue); color: var(--blue); }

            .enc-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            .enc-block {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 3px;
            }
            .enc-canvas {
                cursor: ns-resize;
                display: block;
            }
            .enc-label {
                font-size: 0.6rem;
                color: var(--dim);
                text-align: center;
                letter-spacing: 0.06em;
            }
            .enc-val {
                font-size: 0.68rem;
                color: var(--text);
                font-family: monospace;
                text-align: center;
                background: #0a0a0a;
                border: 1px solid var(--border);
                border-radius: 3px;
                padding: 0 5px;
                min-width: 36px;
            }
            .enc-hint {
                font-size: 0.6rem;
                color: #2a2a2a;
                text-align: center;
                margin-top: 2px;
            }

            /* ── Buttons generic ── */
            .ma-btn {
                padding: 5px 10px;
                background: var(--btn);
                border: 1px solid var(--border);
                color: var(--dim);
                border-radius: 4px;
                cursor: pointer;
                font-size: 0.74rem;
                transition: all 0.1s;
            }
            .ma-btn:hover { background: var(--btn-hov); color: var(--text); }
            .ma-btn.gold  { background: var(--gold-bg); border-color: #5a4800; color: var(--gold); }
            .ma-btn.gold:hover { border-color: var(--gold); }

            /* ── Patch info ── */
            .patch-row {
                display: flex;
                justify-content: space-between;
                font-size: 0.62rem;
                color: #3a3a3a;
                padding: 1px 0;
                font-family: monospace;
            }
            .patch-row:hover { color: var(--dim); }
        `;
        document.head.appendChild(style);

        // ============================================================
        // FIXTURE & PRESET DATA (mirrors simulator)
        // ============================================================
        const TYPES = {
            MH:  { channels: ['DIM','R','G','B','PAN','TLT','STB'] },
            PAR: { channels: ['DIM','R','G','B','STB'] },
        };
        const FIXTURES = [
            { id:0,  name:'MH 1',  type:'MH',  u:0, a:1   },
            { id:1,  name:'MH 2',  type:'MH',  u:0, a:8   },
            { id:2,  name:'MH 3',  type:'MH',  u:0, a:15  },
            { id:3,  name:'MH 4',  type:'MH',  u:0, a:22  },
            { id:4,  name:'MH 5',  type:'MH',  u:0, a:29  },
            { id:5,  name:'MH 6',  type:'MH',  u:0, a:36  },
            { id:6,  name:'PAR 1', type:'PAR', u:0, a:101 },
            { id:7,  name:'PAR 2', type:'PAR', u:0, a:106 },
            { id:8,  name:'PAR 3', type:'PAR', u:0, a:111 },
            { id:9,  name:'PAR 4', type:'PAR', u:0, a:116 },
            { id:10, name:'PAR 5', type:'PAR', u:0, a:121 },
            { id:11, name:'PAR 6', type:'PAR', u:0, a:126 },
        ];

        const PRESETS = [
            { n:'Blackout',        ico:'⬛', color:'#222' },
            { n:'Roter Wash',      ico:'🔴', color:'#600' },
            { n:'Blauer Wash',     ico:'🔵', color:'#006' },
            { n:'Grüner Wash',     ico:'🟢', color:'#030' },
            { n:'Amber Warm',      ico:'🟠', color:'#630' },
            { n:'Club Violett',    ico:'🟣', color:'#306' },
            { n:'Rainbow Split',   ico:'🌈', color:'#244' },
            { n:'Spotlight Mitte', ico:'🎯', color:'#443' },
            { n:'Theater',         ico:'🎭', color:'#433' },
            { n:'Cyan Wash',       ico:'🔷', color:'#035' },
            { n:'Whiteout',        ico:'⬜', color:'#555' },
            { n:'Strobo (alle)',   ico:'⚡', color:'#550' },
        ];

        // ============================================================
        // STATE
        // ============================================================
        let bc            = null;
        let isConnected   = false;
        let dmxMirror     = { 0: new Uint8Array(512), 1: new Uint8Array(512) };
        let savedSeqs     = [];
        let selectedFixId = 0;
        let activeExec    = -1;
        let isSeqPlaying  = false;
        let isSeqLooping  = false;
        let currentCueIdx = -1;
        let cmdLine       = '';
        let masters       = { grand: 255, mh: 255, par: 255 };

        // Encoder state per channel name
        const ENC_CHANNELS = [
            { label: 'DIM', ch: 0, color: '#c8a000', def: 0   },
            { label: 'R',   ch: 1, color: '#d04040', def: 0   },
            { label: 'G',   ch: 2, color: '#40c040', def: 0   },
            { label: 'B',   ch: 3, color: '#4060ff', def: 0   },
            { label: 'PAN', ch: 4, color: '#c0a040', def: 127 },
            { label: 'TLT', ch: 5, color: '#a080c0', def: 127 },
        ];
        let encValues = ENC_CHANNELS.map(e => e.def);
        let encUpdaters = []; // { setValue } refs

        // ============================================================
        // BROADCAST CHANNEL
        // ============================================================
        try {
            bc = new BroadcastChannel('artnet_vt_link');
            bc.onmessage = handleMsg;
        } catch(e) { console.warn('BroadcastChannel unavailable'); }

        function send(msg) { if (bc) bc.postMessage(msg); }

        function handleMsg(evt) {
            const m = evt.data;
            switch (m.type) {
                case 'pong':
                    isConnected = true;
                    updateConnDot(true);
                    if (m.seqs)  { savedSeqs = m.seqs; refreshSeqSelect(); }
                    break;
                case 'dmx_state':
                    if (m.u0) dmxMirror[0] = new Uint8Array(m.u0);
                    if (m.u1) dmxMirror[1] = new Uint8Array(m.u1);
                    updateFixtureDots();
                    updateEncoderDisplay();
                    break;
                case 'seq_list':
                    savedSeqs = m.sequences || [];
                    refreshSeqSelect();
                    break;
                case 'cue_active':
                    currentCueIdx = m.cueIdx;
                    updateSeqDisplay(m);
                    break;
                case 'seq_stopped':
                    isSeqPlaying = false;
                    updateSeqBtns();
                    currentCueIdx = -1;
                    updateSeqDisplay(null);
                    break;
            }
        }

        function updateConnDot(on) {
            const dot = document.getElementById('connDot');
            const lbl = document.getElementById('connLabel');
            if (dot) { dot.className = 'ma-conn-dot' + (on ? ' on' : ''); }
            if (lbl) { lbl.textContent = on ? 'Verbunden' : 'Nicht verbunden'; }
        }

        // ============================================================
        // DMX HELPERS
        // ============================================================
        function gv(fid, ch) {
            const f = FIXTURES[fid];
            return dmxMirror[f.u][f.a - 1 + ch];
        }

        function fixRGB(fid) {
            const d = gv(fid, 0) / 255;
            const r = Math.round(gv(fid, 1) * d);
            const g = Math.round(gv(fid, 2) * d);
            const b = Math.round(gv(fid, 3) * d);
            return { r, g, b, css: `rgb(${r},${g},${b})` };
        }

        // ============================================================
        // TOP BAR
        // ============================================================
        function buildTopBar() {
            const bar = document.getElementById('maTopbar');
            bar.innerHTML = `
                <div class="ma-logo">grandMA3</div>
                <span class="ma-title">ArtNet Simulator · VT LF10 · Universe 0–1 · UDP 6454</span>
                <div class="ma-softkeys">
                    <button class="softkey active" onclick="switchView('exec')">EXEC</button>
                    <button class="softkey" onclick="switchView('patch')">PATCH</button>
                    <button class="softkey" onclick="openSimulator()">⎋ Simulator</button>
                </div>
                <div class="ma-conn">
                    <div class="ma-conn-dot blink" id="connDot"></div>
                    <span id="connLabel">Verbinde…</span>
                </div>
            `;
        }

        window.openSimulator = function() {
            window.open(window.ARTNET_SIMULATOR_URL, 'artnet_sim',
                'width=1500,height=850,resizable=yes,scrollbars=yes');
        };

        window.switchView = function(v) {
            document.querySelectorAll('.softkey').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            const main = document.getElementById('maCenter');
            if (v === 'patch') buildPatchView();
            else buildCenterExec();
        };

        // ============================================================
        // LEFT PANEL – Fixture & Group Selection
        // ============================================================
        function buildLeftPanel() {
            const body = document.getElementById('maLeftBody');
            body.innerHTML = `
                <div class="sec-label">FIXTURES</div>
                <div class="fix-grid" id="fixGrid"></div>
                <hr class="ma-sep">
                <div class="sec-label">GRUPPEN</div>
                <button class="group-btn" id="grp-ALL" onclick="selectGroup('ALL')">⬛ Alle Fixtures</button>
                <button class="group-btn" id="grp-MH"  onclick="selectGroup('MH')">💡 MH Gruppe (1–6)</button>
                <button class="group-btn" id="grp-PAR" onclick="selectGroup('PAR')">🔵 PAR Gruppe (1–6)</button>
            `;

            const grid = document.getElementById('fixGrid');
            FIXTURES.forEach(f => {
                const btn = document.createElement('div');
                btn.className = 'fix-btn' + (selectedFixId === f.id ? ' selected' : '');
                btn.id = `fxb-${f.id}`;
                btn.innerHTML = `<div class="fix-dot" id="fxd-${f.id}"></div><span class="fix-name">${f.name}</span>`;
                btn.addEventListener('click', () => selectFixture(f.id));
                grid.appendChild(btn);
            });
        }

        function selectFixture(fid) {
            selectedFixId = fid;
            document.querySelectorAll('.fix-btn').forEach(b => b.classList.remove('selected'));
            document.getElementById(`fxb-${fid}`)?.classList.add('selected');
            document.querySelectorAll('.group-btn').forEach(b => b.classList.remove('active'));
            updateEncoderDisplay();
            setCmdLine(`Fixture ${FIXTURES[fid].name} selektiert`);
        }

        window.selectGroup = function(group) {
            document.querySelectorAll('.group-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`grp-${group}`)?.classList.add('active');
            document.querySelectorAll('.fix-btn').forEach(b => {
                const fid = parseInt(b.dataset.fid || b.id.split('-')[1]);
                const f = FIXTURES[fid];
                if (f && (group === 'ALL' || f.type === group)) b.classList.add('selected');
                else b.classList.remove('selected');
            });
            setCmdLine(`Gruppe ${group} selektiert`);
        };

        function updateFixtureDots() {
            FIXTURES.forEach(f => {
                const dot = document.getElementById(`fxd-${f.id}`);
                if (dot) dot.style.background = fixRGB(f.id).css;
            });
        }

        // ============================================================
        // CENTER PANEL – Executor Wing
        // ============================================================
        function buildCenterExec() {
            const body = document.getElementById('maCenterBody');
            body.innerHTML = `
                <div class="sec-label">PRESET EXECUTORS – Reihe 1</div>
                <div class="exec-grid" id="execRow1"></div>
                <div class="sec-label" style="margin-top:8px;">PRESET EXECUTORS – Reihe 2</div>
                <div class="exec-grid" id="execRow2"></div>
                <hr class="ma-sep" style="margin:10px 0;">
                <div class="sec-label">MASTER FADER</div>
                <div class="master-row" id="masterRow"></div>
            `;

            // Executor rows
            [0, 1].forEach(row => {
                const grid = document.getElementById(`execRow${row + 1}`);
                for (let i = 0; i < 6; i++) {
                    const idx = row * 6 + i;
                    const p = PRESETS[idx];
                    const block = document.createElement('div');
                    block.className = 'exec-block';
                    block.innerHTML = `
                        <div class="exec-screen" id="exscr-${idx}">
                            <span class="exec-num">${idx + 1}</span>
                            <span class="exec-ico">${p.ico}</span>
                            <span class="exec-name" id="exnm-${idx}">${p.n}</span>
                            <div class="exec-led" id="exled-${idx}"></div>
                        </div>
                        <div class="exec-btns">
                            <button class="exec-go"    id="exgo-${idx}"    onclick="triggerPreset(${idx})">GO</button>
                            <button class="exec-flash" id="exflash-${idx}">FLASH</button>
                        </div>
                    `;
                    grid.appendChild(block);

                    // Flash = hold to activate
                    const flash = block.querySelector('.exec-flash');
                    flash.addEventListener('mousedown', () => {
                        triggerPreset(idx);
                        flash.style.background = '#2a1a00';
                    });
                    flash.addEventListener('mouseup',   () => { flash.style.background = ''; });
                    flash.addEventListener('mouseleave', () => { flash.style.background = ''; });
                }
            });

            buildMasterFaders();
        }

        window.triggerPreset = function(idx) {
            const p = PRESETS[idx];
            send({ type: 'preset', name: p.n });
            activeExec = idx;

            // Visual feedback
            document.querySelectorAll('.exec-screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.exec-led').forEach(l => { l.className = 'exec-led'; });
            document.querySelectorAll('.exec-name').forEach(n => n.classList.remove('active'));

            const scr = document.getElementById(`exscr-${idx}`);
            const led = document.getElementById(`exled-${idx}`);
            const nm  = document.getElementById(`exnm-${idx}`);

            if (scr) { scr.classList.add('active'); scr.style.borderColor = p.color; }
            if (led) { led.classList.add('active'); }
            if (nm)  { nm.classList.add('active'); }

            // Blackout → deactivate all
            if (idx === 0) {
                scr?.classList.remove('active');
                led?.classList.remove('active');
                nm?.classList.remove('active');
                activeExec = -1;
                if (scr) scr.style.borderColor = '';
            }

            setCmdLine(`Preset ${idx + 1}: "${p.n}" → ausgeführt`);
        };

        // ── Master Faders ──
        function buildMasterFaders() {
            const row = document.getElementById('masterRow');
            if (!row) return;
            const defs = [
                { id: 'grand', label: 'GRAND MASTER', cls: 'grand', key: 'grand' },
                { id: 'mh',    label: 'MH GRUPPE',    cls: 'mh',    key: 'mh'    },
                { id: 'par',   label: 'PAR GRUPPE',   cls: 'par',   key: 'par'   },
            ];
            defs.forEach(d => {
                const block = document.createElement('div');
                block.className = 'master-block';
                block.innerHTML = `
                    <span class="master-label ${d.cls}">${d.label}</span>
                    <div class="fader-track" id="ft-${d.id}">
                        <div class="fader-fill ${d.cls}" id="ff-${d.id}" style="height:${masters[d.key]/255*98}px;"></div>
                        <input type="range" min="0" max="255" value="${masters[d.key]}"
                               id="fm-${d.id}" orient="vertical">
                    </div>
                    <span class="master-val ${d.cls}" id="mv-${d.id}">${Math.round(masters[d.key]/255*100)}%</span>
                `;
                row.appendChild(block);

                const inp = block.querySelector('input');
                inp.addEventListener('input', () => {
                    const v = parseInt(inp.value);
                    masters[d.key] = v;
                    document.getElementById(`ff-${d.id}`).style.height = `${v / 255 * 98}px`;
                    document.getElementById(`mv-${d.id}`).textContent = `${Math.round(v / 255 * 100)}%`;
                    send({ type: 'group_dim', group: d.key.toUpperCase(), value: v });
                    setCmdLine(`Master ${d.label}: ${Math.round(v / 255 * 100)}%`);
                });
            });
        }

        // ── Patch view ──
        function buildPatchView() {
            const body = document.getElementById('maCenterBody');
            body.innerHTML = `
                <div class="sec-label">FIXTURE PATCH – Universe 0</div>
                ${FIXTURES.map(f =>
                    `<div class="patch-row">
                        <span style="color:#5090a0;">${f.name}</span>
                        <span>${TYPES[f.type].channels.length}CH</span>
                        <span>U${f.u}</span>
                        <span>Addr ${f.a}–${f.a + TYPES[f.type].channels.length - 1}</span>
                    </div>`
                ).join('')}
                <hr class="ma-sep">
                <div class="sec-label">ARTNET INFO</div>
                <div class="patch-row"><span style="color:#4a7a4a;">Protokoll</span><span>ArtNet 4</span></div>
                <div class="patch-row"><span style="color:#4a7a4a;">OpCode</span><span>0x5000 (ArtDMX)</span></div>
                <div class="patch-row"><span style="color:#4a7a4a;">UDP Port</span><span>6454</span></div>
                <div class="patch-row"><span style="color:#4a7a4a;">IP-Range</span><span>2.x.x.x / 10.x.x.x</span></div>
                <div class="patch-row"><span style="color:#4a7a4a;">ProtVer</span><span>14</span></div>
                <div class="patch-row"><span style="color:#4a7a4a;">Universes</span><span>0 und 1 (512 CH)</span></div>
            `;
        }

        // ============================================================
        // RIGHT PANEL – Encoder + Sequence Player
        // ============================================================
        function buildRightPanel() {
            const body = document.getElementById('maRightBody');
            body.innerHTML = `
                <div class="sec-label">ENCODER – selektiertes Fixture</div>
                <div class="enc-select-row" id="encSelRow">
                    ${FIXTURES.map(f =>
                        `<button class="enc-fix-btn${selectedFixId === f.id ? ' active':''}"
                                 id="encfb-${f.id}"
                                 onclick="selectFixtureEnc(${f.id})">${f.name}</button>`
                    ).join('')}
                </div>
                <div class="enc-grid" id="encGrid"></div>
                <p class="enc-hint">Maus auf Knopf + rauf/runter ziehen</p>
                <hr class="ma-sep">
                <div class="sec-label">SEQUENCE PLAYER</div>
                <div class="seq-box">
                    <select class="seq-select" id="seqSel">
                        <option value="">– Sequenz wählen –</option>
                    </select>
                    <div class="seq-display" id="seqDisp">Keine Sequenz geladen</div>
                    <div class="seq-controls">
                        <button class="seq-btn play" id="seqPlay" onclick="seqGo()">▶ GO</button>
                        <button class="seq-btn stop" id="seqStop" onclick="seqStop()">⏹</button>
                        <button class="seq-btn" id="seqLoop" onclick="seqToggleLoop()">🔁</button>
                    </div>
                    <div id="seqCueList" class="seq-cue-list"></div>
                </div>
                <hr class="ma-sep">
                <div class="sec-label">NUMERIK</div>
                <div id="numPad" style="display:grid;grid-template-columns:repeat(3,1fr);gap:3px;"></div>
            `;

            buildEncoders();
            buildNumPad();
            refreshSeqSelect();
        }

        window.selectFixtureEnc = function(fid) {
            selectedFixId = fid;
            document.querySelectorAll('.enc-fix-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`encfb-${fid}`)?.classList.add('active');
            document.querySelectorAll('.fix-btn').forEach(b => b.classList.remove('selected'));
            document.getElementById(`fxb-${fid}`)?.classList.add('selected');
            updateEncoderDisplay();
            setCmdLine(`Fixture ${FIXTURES[fid].name} → Encoder aktiv`);
        };

        // ── Encoder Knobs ──
        function buildEncoders() {
            const grid = document.getElementById('encGrid');
            if (!grid) return;
            encUpdaters = [];

            ENC_CHANNELS.forEach((ec, idx) => {
                const block = document.createElement('div');
                block.className = 'enc-block';

                const canvas = document.createElement('canvas');
                canvas.width  = 62;
                canvas.height = 62;
                canvas.className = 'enc-canvas';
                canvas.title = ec.label;

                const labelEl = document.createElement('div');
                labelEl.className = 'enc-label';
                labelEl.textContent = ec.label;

                const valEl = document.createElement('div');
                valEl.className = 'enc-val';
                valEl.textContent = encValues[idx];

                block.appendChild(canvas);
                block.appendChild(labelEl);
                block.appendChild(valEl);
                grid.appendChild(block);

                // Draw encoder
                function draw(v) {
                    const ctx = canvas.getContext('2d');
                    const size = 62, cx = 31, cy = 31, r = 24;
                    ctx.clearRect(0, 0, size, size);

                    // Background
                    ctx.beginPath();
                    ctx.arc(cx, cy, r + 2, 0, Math.PI * 2);
                    ctx.fillStyle = '#141414';
                    ctx.fill();

                    // Track
                    const sa = 2.356, range = Math.PI * 1.5;
                    ctx.beginPath();
                    ctx.arc(cx, cy, r, sa, sa + range);
                    ctx.strokeStyle = '#1e1e1e';
                    ctx.lineWidth = 5;
                    ctx.lineCap = 'round';
                    ctx.stroke();

                    // Value arc
                    const ea = sa + (v / 255) * range;
                    ctx.beginPath();
                    ctx.arc(cx, cy, r, sa, ea);
                    ctx.strokeStyle = ec.color;
                    ctx.lineWidth = 5;
                    ctx.lineCap = 'round';
                    ctx.stroke();

                    // Center
                    ctx.beginPath();
                    ctx.arc(cx, cy, 8, 0, Math.PI * 2);
                    ctx.fillStyle = '#252525';
                    ctx.fill();

                    // Indicator
                    const ia = sa + (v / 255) * range;
                    const ix = cx + Math.cos(ia) * (r - 5);
                    const iy = cy + Math.sin(ia) * (r - 5);
                    ctx.beginPath();
                    ctx.arc(ix, iy, 3, 0, Math.PI * 2);
                    ctx.fillStyle = '#fff';
                    ctx.fill();
                }

                // Mouse interaction
                let dragging = false, lastY = 0;

                canvas.addEventListener('mousedown', e => {
                    dragging = true;
                    lastY = e.clientY;
                    e.preventDefault();
                });
                document.addEventListener('mousemove', e => {
                    if (!dragging) return;
                    const delta = lastY - e.clientY;
                    lastY = e.clientY;
                    encValues[idx] = Math.max(0, Math.min(255, encValues[idx] + delta));
                    const v = Math.round(encValues[idx]);
                    valEl.textContent = v;
                    draw(v);
                    // Send to simulator
                    if (selectedFixId !== null) {
                        send({ type: 'dmx_set', fid: selectedFixId, ch: ec.ch, value: v });
                    }
                });
                document.addEventListener('mouseup', () => { dragging = false; });

                // Double-click to reset
                canvas.addEventListener('dblclick', () => {
                    encValues[idx] = ec.def;
                    valEl.textContent = ec.def;
                    draw(ec.def);
                    if (selectedFixId !== null) {
                        send({ type: 'dmx_set', fid: selectedFixId, ch: ec.ch, value: ec.def });
                    }
                });

                draw(encValues[idx]);
                encUpdaters.push({ draw, valEl });
            });
        }

        function updateEncoderDisplay() {
            if (selectedFixId === null) return;
            const f = FIXTURES[selectedFixId];
            if (!f) return;
            ENC_CHANNELS.forEach((ec, idx) => {
                // Only update channels that exist for this fixture type
                const chs = TYPES[f.type].channels;
                if (ec.ch < chs.length) {
                    const v = dmxMirror[f.u][f.a - 1 + ec.ch];
                    encValues[idx] = v;
                    if (encUpdaters[idx]) {
                        encUpdaters[idx].draw(v);
                        encUpdaters[idx].valEl.textContent = v;
                    }
                }
            });
        }

        // ── Sequence Player ──
        function refreshSeqSelect() {
            const sel = document.getElementById('seqSel');
            if (!sel) return;
            const cur = sel.value;
            sel.innerHTML = '<option value="">– Sequenz wählen –</option>' +
                savedSeqs.map(s => `<option value="${s}"${s === cur ? ' selected' : ''}>${s}</option>`).join('');
        }

        window.seqGo = function() {
            const name = document.getElementById('seqSel')?.value;
            if (!name) { setCmdLine('Keine Sequenz ausgewählt'); return; }
            isSeqPlaying = true;
            updateSeqBtns();
            send({ type: 'seq_play', name });
            setCmdLine(`Sequenz "${name}" → GO`);
        };

        window.seqStop = function() {
            isSeqPlaying = false;
            updateSeqBtns();
            send({ type: 'seq_stop' });
            setCmdLine('Sequenz gestoppt');
        };

        window.seqToggleLoop = function() {
            isSeqLooping = !isSeqLooping;
            send({ type: 'seq_loop', loop: isSeqLooping });
            updateSeqBtns();
            setCmdLine(`Loop: ${isSeqLooping ? 'AN' : 'AUS'}`);
        };

        function updateSeqBtns() {
            const play = document.getElementById('seqPlay');
            const loop = document.getElementById('seqLoop');
            if (play) play.textContent = isSeqPlaying ? '⏸ PAUSE' : '▶ GO';
            if (loop) { loop.textContent = `🔁 ${isSeqLooping ? 'AN' : 'AUS'}`; loop.className = `seq-btn${isSeqLooping ? ' loop-on' : ''}`; }
        }

        function updateSeqDisplay(m) {
            const disp = document.getElementById('seqDisp');
            if (!disp) return;
            if (!m) {
                disp.textContent = 'Gestoppt';
                document.getElementById('seqCueList').innerHTML = '';
                return;
            }
            disp.textContent =
                `▶ Cue ${m.cueIdx + 1}: "${m.cueName || '?'}"\nFade: ${m.fade || 0}s | Sequenz: ${m.seqName || '?'}`;
        }

        // ── Numpad ──
        function buildNumPad() {
            const np = document.getElementById('numPad');
            if (!np) return;
            const keys = ['7','8','9','4','5','6','1','2','3','.','0','⌫','AT','THRU','FULL'];
            keys.forEach(k => {
                const btn = document.createElement('button');
                btn.className = 'ma-btn';
                btn.style.cssText = 'font-size:0.72rem;padding:5px 2px;text-align:center;';
                btn.textContent = k;
                btn.addEventListener('click', () => {
                    if (k === '⌫') cmdLine = cmdLine.slice(0, -1);
                    else if (k === 'FULL') { cmdLine += '255'; }
                    else cmdLine += k;
                    const disp = document.getElementById('cmdDisplay');
                    if (disp) disp.textContent = cmdLine || '_';
                });
                np.appendChild(btn);
            });
        }

        // ============================================================
        // FOOTER – Command Line
        // ============================================================
        function buildFooter() {
            const footer = document.getElementById('maFooter');
            footer.innerHTML = `
                <span class="cmd-prompt">&gt;</span>
                <span class="cmd-display" id="cmdDisplay"><span class="cmd-caret">_</span></span>
                <span class="cmd-info" id="cmdInfo">Letzte Aktion: –</span>
            `;

            document.addEventListener('keydown', e => {
                if (['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)) return;
                if (e.key === 'Backspace') { cmdLine = cmdLine.slice(0, -1); }
                else if (e.key === 'Escape') { cmdLine = ''; }
                else if (e.key === 'Enter') {
                    processCmd(cmdLine);
                    cmdLine = '';
                } else if (e.key.length === 1) {
                    cmdLine += e.key;
                }
                const disp = document.getElementById('cmdDisplay');
                if (disp) disp.innerHTML = (cmdLine || '') + '<span class="cmd-caret">_</span>';
            });
        }

        function setCmdLine(msg) {
            const info = document.getElementById('cmdInfo');
            if (info) info.textContent = `Letzte Aktion: ${msg}`;
        }

        function processCmd(cmd) {
            cmd = cmd.trim().toUpperCase();
            if (!cmd) return;
            if (cmd === 'BLACKOUT' || cmd === 'BO') { triggerPreset(0); }
            else if (cmd === 'FULL') {
                // FULL all fixtures
                FIXTURES.forEach(f => send({ type: 'dmx_set', fid: f.id, ch: 0, value: 255 }));
                setCmdLine('FULL → alle Dimmer 255');
            } else {
                setCmdLine(`Unbekannter Befehl: ${cmd}`);
            }
        }

        // ============================================================
        // INIT
        // ============================================================
        buildTopBar();
        document.getElementById('maLeftBody')  && buildLeftPanel();
        buildCenterExec();
        buildRightPanel();

        // Ping simulator
        setTimeout(() => {
            send({ type: 'ping' });
            const dot = document.getElementById('connDot');
            if (dot) dot.className = 'ma-conn-dot blink';
        }, 300);

        // Timeout for "not connected" state
        setTimeout(() => {
            if (!isConnected) {
                updateConnDot(false);
                const lbl = document.getElementById('connLabel');
                if (lbl) lbl.textContent = 'Simulator nicht offen';
            }
        }, 3000);

        // Refresh seq list periodically if connected
        setInterval(() => {
            if (isConnected) send({ type: 'ping' });
        }, 10000);

    }); // DOMContentLoaded
    </script>
</head>
<body>
<div class="ma-console">

    <!-- Top Bar -->
    <div class="ma-topbar" id="maTopbar"></div>

    <!-- 3-Column Layout -->
    <div class="ma-main">

        <!-- ── Left: Fixture / Group ── -->
        <div class="ma-panel">
            <div class="panel-title">FIXTURE &amp; GRUPPEN</div>
            <div class="panel-body" id="maLeftBody"></div>
        </div>

        <div class="ma-panel">

            <div class="panel-body" id="maCenterBody"></div>
        </div>

        <!-- ── Right: Encoder + Sequence ── -->
        <div class="ma-panel">
            <div class="panel-title">ENCODER · SEQUENCE PLAYER</div>
            <div class="panel-body" id="maRightBody"></div>
        </div>

    </div>

    <!-- Footer / Command Line -->
    <div class="ma-footer" id="maFooter"></div>

</div>
</body>
</html>
