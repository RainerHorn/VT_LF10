<!DOCTYPE html>
<html>
<head>
    <title>SVG zu WebP Konverter</title>
</head>
<body>
    <canvas id="canvas" width="1200" height="400" style="border: 1px solid #ccc;"></canvas>
    <br><br>
    <button onclick="downloadAsWebP()">Als WebP herunterladen</button>
    
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // SVG Content
        const svgContent = `<svg width="1200" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Hintergrund Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e2a4a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2d4a6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="nodeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="backupGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#93c5fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow Effekt -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Schatten -->
    <filter id="dropshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Hintergrund -->
  <rect width="1200" height="400" fill="url(#bgGradient)"/>
  
  <!-- Netzwerk-Verbindungen (Hauptpfade) -->
  <g stroke="#3b82f6" stroke-width="4" fill="none" opacity="0.8">
    <line x1="200" y1="150" x2="350" y2="120" stroke-dasharray="0"/>
    <line x1="350" y1="120" x2="500" y2="150" stroke-dasharray="0"/>
    <line x1="500" y1="150" x2="650" y2="120" stroke-dasharray="0"/>
    <line x1="650" y1="120" x2="800" y2="150" stroke-dasharray="0"/>
    <line x1="800" y1="150" x2="950" y2="120" stroke-dasharray="0"/>
  </g>
  
  <!-- Redundante Verbindungen (Backup-Pfade) -->
  <g stroke="#93c5fd" stroke-width="3" fill="none" opacity="0.7">
    <line x1="200" y1="150" x2="350" y2="280" stroke-dasharray="5,5"/>
    <line x1="350" y1="280" x2="500" y2="250" stroke-dasharray="5,5"/>
    <line x1="500" y1="250" x2="650" y2="280" stroke-dasharray="5,5"/>
    <line x1="650" y1="280" x2="800" y2="250" stroke-dasharray="5,5"/>
    <line x1="800" y1="250" x2="950" y2="120" stroke-dasharray="5,5"/>
    
    <!-- Kreuzverbindungen -->
    <line x1="350" y1="120" x2="650" y2="280" stroke-dasharray="3,3" opacity="0.5"/>
    <line x1="500" y1="150" x2="800" y2="250" stroke-dasharray="3,3" opacity="0.5"/>
  </g>
  
  <!-- Hauptknoten (Switches/Router) -->
  <g filter="url(#glow)">
    <!-- Knoten A -->
    <circle cx="200" cy="150" r="25" fill="url(#nodeGradient)" stroke="#ffffff" stroke-width="2"/>
    <circle cx="200" cy="150" r="12" fill="#ffffff" opacity="0.8"/>
    <text x="200" y="156" text-anchor="middle" fill="#1e40af" font-family="Arial, sans-serif" font-size="14" font-weight="bold">A</text>
    
    <!-- Knoten B -->
    <circle cx="350" cy="120" r="25" fill="url(#nodeGradient)" stroke="#ffffff" stroke-width="2"/>
    <circle cx="350" cy="120" r="12" fill="#ffffff" opacity="0.8"/>
    <text x="350" y="126" text-anchor="middle" fill="#1e40af" font-family="Arial, sans-serif" font-size="14" font-weight="bold">B</text>
    
    <!-- Knoten C -->
    <circle cx="500" cy="150" r="25" fill="url(#nodeGradient)" stroke="#ffffff" stroke-width="2"/>
    <circle cx="500" cy="150" r="12" fill="#ffffff" opacity="0.8"/>
    <text x="500" y="156" text-anchor="middle" fill="#1e40af" font-family="Arial, sans-serif" font-size="14" font-weight="bold">C</text>
    
    <!-- Knoten D -->
    <circle cx="650" cy="120" r="25" fill="url(#nodeGradient)" stroke="#ffffff" stroke-width="2"/>
    <circle cx="650" cy="120" r="12" fill="#ffffff" opacity="0.8"/>
    <text x="650" y="126" text-anchor="middle" fill="#1e40af" font-family="Arial, sans-serif" font-size="14" font-weight="bold">D</text>
    
    <!-- Knoten E -->
    <circle cx="800" cy="150" r="25" fill="url(#nodeGradient)" stroke="#ffffff" stroke-width="2"/>
    <circle cx="800" cy="150" r="12" fill="#ffffff" opacity="0.8"/>
    <text x="800" y="156" text-anchor="middle" fill="#1e40af" font-family="Arial, sans-serif" font-size="14" font-weight="bold">E</text>
    
    <!-- Knoten F -->
    <circle cx="950" cy="120" r="25" fill="url(#nodeGradient)" stroke="#ffffff" stroke-width="2"/>
    <circle cx="950" cy="120" r="12" fill="#ffffff" opacity="0.8"/>
    <text x="950" y="126" text-anchor="middle" fill="#1e40af" font-family="Arial, sans-serif" font-size="14" font-weight="bold">F</text>
  </g>
  
  <!-- Backup-Knoten -->
  <g filter="url(#glow)">
    <!-- Backup Knoten 1 -->
    <circle cx="350" cy="280" r="20" fill="url(#backupGradient)" stroke="#ffffff" stroke-width="2"/>
    <circle cx="350" cy="280" r="10" fill="#ffffff" opacity="0.8"/>
    <text x="350" y="285" text-anchor="middle" fill="#1e40af" font-family="Arial, sans-serif" font-size="12" font-weight="bold">B1</text>
    
    <!-- Backup Knoten 2 -->
    <circle cx="500" cy="250" r="20" fill="url(#backupGradient)" stroke="#ffffff" stroke-width="2"/>
    <circle cx="500" cy="250" r="10" fill="#ffffff" opacity="0.8"/>
    <text x="500" y="255" text-anchor="middle" fill="#1e40af" font-family="Arial, sans-serif" font-size="12" font-weight="bold">B2</text>
    
    <!-- Backup Knoten 3 -->
    <circle cx="650" cy="280" r="20" fill="url(#backupGradient)" stroke="#ffffff" stroke-width="2"/>
    <circle cx="650" cy="280" r="10" fill="#ffffff" opacity="0.8"/>
    <text x="650" y="285" text-anchor="middle" fill="#1e40af" font-family="Arial, sans-serif" font-size="12" font-weight="bold">B3</text>
    
    <!-- Backup Knoten 4 -->
    <circle cx="800" cy="250" r="20" fill="url(#backupGradient)" stroke="#ffffff" stroke-width="2"/>
    <circle cx="800" cy="250" r="10" fill="#ffffff" opacity="0.8"/>
    <text x="800" y="255" text-anchor="middle" fill="#1e40af" font-family="Arial, sans-serif" font-size="12" font-weight="bold">B4</text>
  </g>
  
  <!-- Titel -->
  <text x="600" y="50" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="42" font-weight="bold" filter="url(#dropshadow)">REDUNDANZ IN DER NETZWERKTECHNIK</text>
  
  <!-- Untertitel -->
  <text x="600" y="80" text-anchor="middle" fill="#93c5fd" font-family="Arial, sans-serif" font-size="20" font-weight="normal" filter="url(#dropshadow)">Ausfallsichere Netzwerkarchitekturen für Veranstaltungstechnik</text>
  
  <!-- Redundanz-Symbole und Labels -->
  <!-- Failover-Pfeil -->
  <g fill="#ffffff" stroke="#3b82f6" stroke-width="1">
    <polygon points="420,135 440,125 440,130 450,130 450,140 440,140 440,145" opacity="0.9"/>
    <text x="460" y="138" fill="#ffffff" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Failover</text>
  </g>
  
  <!-- Backup-Pfeil -->
  <g fill="#93c5fd" stroke="#ffffff" stroke-width="1">
    <polygon points="520,265 540,255 540,260 550,260 550,270 540,270 540,275" opacity="0.9"/>
    <text x="560" y="268" fill="#93c5fd" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Backup Path</text>
  </g>
  
  <!-- Legende -->
  <g transform="translate(50, 320)">
    <rect x="0" y="0" width="300" height="70" fill="#1e2a4a" stroke="#3b82f6" stroke-width="1" rx="5" opacity="0.8"/>
    
    <!-- Hauptpfad -->
    <line x1="10" y1="20" x2="40" y2="20" stroke="#3b82f6" stroke-width="3"/>
    <text x="50" y="25" fill="#ffffff" font-family="Arial, sans-serif" font-size="12">Hauptpfad (Primary Path)</text>
    
    <!-- Backup-Pfad -->
    <line x1="10" y1="40" x2="40" y2="40" stroke="#93c5fd" stroke-width="3" stroke-dasharray="5,5"/>
    <text x="50" y="45" fill="#ffffff" font-family="Arial, sans-serif" font-size="12">Backup-Pfad (Redundant Path)</text>
    
    <!-- Redundanz-Level -->
    <text x="10" y="60" fill="#93c5fd" font-family="Arial, sans-serif" font-size="10" font-weight="bold">Redundanz-Level: N+1</text>
  </g>
  
  <!-- Status-Indikator -->
  <g transform="translate(1050, 320)">
    <rect x="0" y="0" width="140" height="50" fill="#065f46" stroke="#10b981" stroke-width="1" rx="5" opacity="0.9"/>
    <circle cx="20" cy="25" r="6" fill="#10b981"/>
    <text x="35" y="20" fill="#ffffff" font-family="Arial, sans-serif" font-size="10" font-weight="bold">SYSTEM STATUS</text>
    <text x="35" y="35" fill="#d1fae5" font-family="Arial, sans-serif" font-size="12" font-weight="bold">REDUNDANT</text>
  </g>
</svg>`;

        // Render SVG to Canvas
        const img = new Image();
        const svgBlob = new Blob([svgContent], {type: 'image/svg+xml;charset=utf-8'});
        const url = URL.createObjectURL(svgBlob);
        
        img.onload = function() {
            ctx.drawImage(img, 0, 0);
            URL.revokeObjectURL(url);
        };
        
        img.src = url;
        
        function downloadAsWebP() {
            canvas.toBlob(function(blob) {
                const link = document.createElement('a');
                link.download = 'Redundanz_Netzwerktechnik.webp';
                link.href = URL.createObjectURL(blob);
                link.click();
            }, 'image/webp', 0.9);
        }
        
        // Auto-download nach 2 Sekunden
        setTimeout(downloadAsWebP, 2000);
    </script>
</body>
</html>
